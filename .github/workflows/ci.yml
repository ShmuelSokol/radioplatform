name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "wiki/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "wiki/**"
      - "docs/**"
      - "**/*.md"

# A newer push to the same PR cancels the older, now-useless run. Each push to main
# has its own group: in one shared group a run waiting behind the deploy gate was
# cancelled by the next merge, and when that next merge changed no backend file
# Railway deployed nothing, leaving the backend on the old commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app/ tests/

  backend-test:
    runs-on: ubuntu-latest
    # Everything but the station simulator (backend-sim, alongside): about 8 min. In one
    # job the suite reached 22 min and PR 491 was cut off at 30 (2026-11-22)
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radio
          POSTGRES_PASSWORD: radio
          POSTGRES_DB: radioplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # Some tests run small frontend helpers (lib/stationTime.ts) in Node 22, which reads TypeScript.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://radio:radio@localhost:5432/radioplatform
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v --tb=short --durations=25 --ignore=tests/test_station_sim.py

  # The station simulator's broadcast-day scenarios (tests/test_station_sim.py, 17 min on
  # a runner of its own and growing with every scenario) run beside backend-test in two
  # halves of about 8 min, so no job nears its limit. SQLite only: no Postgres, Redis or
  # Node to start. A new scenario lands in the second half (`not` the first's names);
  # move names between them when one half passes about 20 min.
  backend-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part:
          - "motzei or candle_lighting_item or daf_yomi"
          - "not (motzei or candle_lighting_item or daf_yomi)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Run simulator scenarios
        working-directory: backend
        env:
          PART: ${{ matrix.part }}
        run: pytest tests/test_station_sim.py -k "$PART" -v --tb=short --durations=15

  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint

  # Railway waits for CI ("Wait for CI"), so the backend restarts only when this last
  # job is done: not during a live show, not at a time check (wiki/deploys.md).
  # [deploy-now] in the merge commit's message skips the wait.
  deploy-gate:
    if: github.event_name == 'push'
    needs: [backend-lint, backend-test, backend-sim, frontend-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
      - name: Wait while a live show is on air
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 infra/deploy/deploy_gate.py
