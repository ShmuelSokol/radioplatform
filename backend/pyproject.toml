[project]
name = "radioplatform"
version = "0.1.0"
description = "Multi-channel radio streaming platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.1.3",
    "python-multipart>=0.0.12",
    "email-validator>=2.0.0",
    "aioboto3>=13.0.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "mutagen>=1.47.0",
    "pillow>=11.0.0",
    "astral>=3.2",
    "pyluach>=2.2.0",
    "numpy>=1.26.0",
    "stripe>=8.0.0",
    "resend>=2.0.0",
    "anthropic>=0.83.0",
    "twilio>=9.0.0",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.0.0",
    "timezonefinder>=6.5.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "anyio>=4.12.1",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Style-only rules the existing code does not follow. They are switched off so
# that a red lint check means a real problem (undefined name, unused import,
# unused variable, duplicate key). Turn one back on only together with the
# repo-wide reformat that satisfies it.
ignore = [
    "E501",   # line length
    "I001",   # import sorting
    "W293",   # whitespace on blank lines
    "E402",   # imports below module-level setup (used on purpose in a few files)
    "E712",   # `== True` / `== False` is how SQLAlchemy filters are written
    "N806",   # upper-case constants inside functions
    "UP006",  # typing.List -> list
    "UP017",  # timezone.utc -> datetime.UTC
    "UP034",  # extra parentheses
    "UP035",  # deprecated typing imports
    "UP041",  # asyncio.TimeoutError alias
    "UP042",  # (str, Enum) -> StrEnum changes str() output, not a safe rewrite
    "UP045",  # Optional[X] -> X | None
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
