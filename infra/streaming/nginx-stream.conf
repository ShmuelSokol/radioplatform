# /etc/nginx/sites-available/kbr-stream — setup.sh replaces STREAM_DOMAIN.
# Plain HTTP here; certbot adds the TLS server block and the redirect.
server {
    listen 80;
    server_name STREAM_DOMAIN;

    # Listeners
    location = /live {
        proxy_pass http://127.0.0.1:8000/live;
        proxy_set_header Host $host;
        proxy_buffering off;          # live audio must not be buffered
        proxy_read_timeout 86400;
        add_header Access-Control-Allow-Origin *;
    }

    # Backend -> engine commands (Next, timed items). The engine checks X-Playout-Token.
    location /control/ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8081/;
        proxy_read_timeout 10;
    }

    location / { return 404; }
}
