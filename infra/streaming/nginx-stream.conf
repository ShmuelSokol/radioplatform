# /etc/nginx/sites-available/kbr-stream — setup.sh writes it (STREAM_DOMAIN filled in)
# on every run; certbot then adds the TLS server block and the redirect again.
server {
    listen 80;
    server_name STREAM_DOMAIN;

    # Listeners: one stream per station, /live-<station id>
    location ~ "^/live-[0-9a-f-]{36}$" {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_buffering off;          # live audio must not be buffered
        proxy_read_timeout 86400;
        add_header Access-Control-Allow-Origin *;
    }

    # iPhone Safari: the same stream as HLS, /hls/<station id>/mp3.m3u8 (radio.liq writes
    # 1 s segments to /var/lib/kbr-engine/hls/<station id>). Nothing is cached: the
    # playlist changes every second, and segment names start again at 1 when an engine
    # restarts.
    location ~ "^/hls/([0-9a-f-]{36})/([a-z0-9_]+\.m3u8)$" {
        alias /var/lib/kbr-engine/hls/$1/$2;
        types { application/vnd.apple.mpegurl m3u8; }
        add_header Cache-Control "no-cache, no-store" always;
        add_header Access-Control-Allow-Origin * always;
    }
    location ~ "^/hls/([0-9a-f-]{36})/([a-z0-9_]+\.mp3)$" {
        alias /var/lib/kbr-engine/hls/$1/$2;
        types { audio/mpeg mp3; }
        add_header Cache-Control "no-cache, no-store" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # Backend -> engine commands (Next, timed items): /control/<station id>/<command>,
    # each routed to that station's engine. The engines check X-Playout-Token.
    include /etc/nginx/kbr-control.inc;

    location / { return 404; }
}
